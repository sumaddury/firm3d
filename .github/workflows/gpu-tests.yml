name: GPU Tests

on:
  push:
  pull_request:

jobs:
  gpu-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev pkg-config

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install netCDF4 pytest
          python -m pip install -e .
        env:
          NETCDF_DIR: /usr
          HDF5_DIR: /usr
          GSL_DIR: /usr

      - name: Run GPU test file
        run: |
          python -m pytest tests/field/test_gpu.py -q
